<!DOCTYPE html>
<html>
<head>
<title>Valentine Surprise</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffe6eb;
    font-family:Arial;
    flex-direction:column;
    text-align:center;
    padding:20px;
    overflow:hidden;
}
h1 {
    font-size:6vw;
}
button {
    padding:15px 30px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
#yes {
    background:#ff4d6d;
    color:white;
}
#no {
    background:#ccc;
    position:absolute;
}

@keyframes floatUp {
    to {
        transform: translateY(-120vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<h1 id="question">Kanika, Will you be my Valentine? ❤️</h1>

<div>
<button id="yes" onclick="yesClicked()">Yes 💖</button>
<button id="no">No 😢</button>
</div>

<script>
const noBtn = document.getElementById("no");

function moveButton() {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);
    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Desktop hover
noBtn.addEventListener("mouseenter", moveButton);

// Mobile touch
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
});

function yesClicked() {
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#ffe6eb;font-family:Arial;text-align:center;overflow:hidden;">
        <h1 style="font-size:8vw;">I knew it 😍</h1>
        <p style="font-size:5vw;">See you soon ❤️</p>
    </div>
    `;

    for(let i=0;i<25;i++){
        let heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.style.position = "fixed";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = "24px";
        heart.style.animation = "floatUp 3s linear forwards";
        document.body.appendChild(heart);
    }
}
</script>

</body>
</html>
